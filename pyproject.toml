[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "implied-volatility-surface"
version = "0.2.0"
description = "An India/NSE options volatility surface toolkit with SVI/SSVI fitting and diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Implied Volatility Surface contributors"}]
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0",
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "streamlit>=1.32",
  "plotly>=5.20", "pydantic>=2.6", "requests>=2.31", "python-dotenv>=1.0",
  "fyers-apiv3>=3.2.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data*", "api*"]

[tool.setuptools.package-data]
data = ["*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001", "S110"]

[tool.black]
line-length = 100
target-version = ["py310"]
